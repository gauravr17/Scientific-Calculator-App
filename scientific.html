<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Scientific Calculator</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --calc-bg: #2d2d2d;
            --display-bg: #a8b7a2;
            --text-color: #ffffff;
            --btn-num: #4a4a4a;
            --btn-op: #636363;
            --btn-func: #3a3a3a;
            --btn-accent: #ff9500;
            --btn-danger: #d9534f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .calculator {
            background-color: var(--calc-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 20px 50px rgba(0,0,0,0.5);
            width: 420px;
            border: 1px solid #444;
        }
        .display-container {
            margin-bottom: 20px;
        }
        #formula {
            width: 100%;
            text-align: right;
            font-size: 16px;
            color: #888;
            border: none;
            background: transparent;
            outline: none;
            margin-bottom: 5px;
        }
        #display {
            width: 100%;
            height: 60px;
            font-size: 32px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #444;
            border-radius: 8px;
            background-color: var(--display-bg);
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px 5px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: all 0.1s;
            font-weight: 500;
        }
        button:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }
        .num { background-color: var(--btn-num); }
        .op { background-color: var(--btn-op); }
        .func { background-color: var(--btn-func); font-size: 12px; }
        .accent { background-color: var(--btn-accent); }
        .danger { background-color: var(--btn-danger); }
        .wide { grid-column: span 2; }

        .mode-indicator {
            font-size: 12px;
            text-align: left;
            margin-bottom: 5px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="mode-indicator" id="mode">DEG</div>
    <div class="display-container">
        <input type="text" id="formula" readonly placeholder="0">
        <input type="text" id="display" value="0" readonly>
    </div>
    <div class="buttons">
        <!-- Row 1: Advanced Functions -->
        <button class="func" onclick="setMode()">Deg/Rad</button>
        <button class="func" onclick="appendFunc('Math.sin')">sin</button>
        <button class="func" onclick="appendFunc('Math.cos')">cos</button>
        <button class="func" onclick="appendFunc('Math.tan')">tan</button>
        <button class="danger" onclick="clearAll()">AC</button>

        <!-- Row 2: Advanced Functions -->
        <button class="func" onclick="appendFunc('Math.log10')">log</button>
        <button class="func" onclick="appendFunc('Math.log')">ln</button>
        <button class="func" onclick="appendFunc('Math.sqrt')">√</button>
        <button class="func" onclick="appendOp('**')">xʸ</button>
        <button class="danger" onclick="backspace()">DEL</button>

        <!-- Row 3: More Functions -->
        <button class="func" onclick="appendConst('Math.PI')">π</button>
        <button class="func" onclick="appendConst('Math.E')">e</button>
        <button class="func" onclick="appendFunc('Math.exp')">exp</button>
        <button class="func" onclick="appendOp('(')">(</button>
        <button class="func" onclick="appendOp(')')">)</button>

        <!-- Row 4: Numbers & Basic Ops -->
        <button class="num" onclick="appendNum('7')">7</button>
        <button class="num" onclick="appendNum('8')">8</button>
        <button class="num" onclick="appendNum('9')">9</button>
        <button class="op" onclick="appendOp('/')">÷</button>
        <button class="op" onclick="appendFunc('Math.abs')">abs</button>

        <!-- Row 5 -->
        <button class="num" onclick="appendNum('4')">4</button>
        <button class="num" onclick="appendNum('5')">5</button>
        <button class="num" onclick="appendNum('6')">6</button>
        <button class="op" onclick="appendOp('*')">×</button>
        <button class="op" onclick="appendOp('%')">mod</button>

        <!-- Row 6 -->
        <button class="num" onclick="appendNum('1')">1</button>
        <button class="num" onclick="appendNum('2')">2</button>
        <button class="num" onclick="appendNum('3')">3</button>
        <button class="op" onclick="appendOp('-')">−</button>
        <button class="func" onclick="appendFunc('Math.ceil')">ceil</button>

        <!-- Row 7 -->
        <button class="num" onclick="appendNum('0')">0</button>
        <button class="num" onclick="appendNum('.')">.</button>
        <button class="func" onclick="appendFunc('Math.floor')">floor</button>
        <button class="op" onclick="appendOp('+')">+</button>
        <button class="accent" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '';
    let formula = '';
    let angleMode = 'DEG';

    const display = document.getElementById('display');
    const formulaDisp = document.getElementById('formula');
    const modeDisp = document.getElementById('mode');

    function updateDisplay() {
        display.value = currentInput || '0';
        formulaDisp.value = formula;
    }

    function appendNum(n) {
        currentInput += n;
        updateDisplay();
    }

    function appendOp(op) {
        if (currentInput === '' && op !== '(') return;
        formula += currentInput + op;
        currentInput = '';
        updateDisplay();
    }

    function appendFunc(fn) {
        formula += fn + '(';
        currentInput = '';
        updateDisplay();
    }

    function appendConst(c) {
        currentInput += c.replace('Math.', '');
        updateDisplay();
    }

    function setMode() {
        angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
        modeDisp.innerText = angleMode;
    }

    function clearAll() {
        currentInput = '';
        formula = '';
        updateDisplay();
    }

    function backspace() {
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
    }

    function calculate() {
        try {
            let finalExpression = formula + currentInput;

            // Handle Angle Mode for Trigonometry
            if (angleMode === 'DEG') {
                finalExpression = finalExpression.replace(/Math\.(sin|cos|tan)\(([^)]+)\)/g, (match, func, angle) => {
                    return `Math.${func}((${angle}) * Math.PI / 180)`;
                });
            }

            // Clean up the formula for the user (replace JS Math with symbols)
            let result = eval(finalExpression);

            // Handle floating point precision
            if (!Number.isInteger(result)) {
                result = parseFloat(result.toFixed(8));
            }

            currentInput = result.toString();
            formula = '';
            updateDisplay();
        } catch (e) {
            display.value = 'Error';
            setTimeout(clearAll, 1500);
        }
    }
</script>

</body>
</html>
